name: Check Yinji
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prepare test database
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_wise_morlocks.sql
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            test-results
            outputs
          retention-days: 7
